<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Mudline | Veloi</title><link rel="stylesheet" href="game.css"></head>
<body><link rel="stylesheet" href="multiplayer.css"><style>[hidden]{display:none!important}</style>
<canvas id="scene" aria-label="Mudding course"></canvas>
<header class="hud"><div class="brand"><span class="brand-mark">M</span><div><strong>MUDLINE</strong><small id="mapLabel">Cypress Bog</small></div></div><div class="telemetry"><span><b id="speed">0</b><small>MPH</small></span><span><b id="distance">0</b><small>METERS</small></span><span class="surface" id="surface">TRAIL</span></div><nav><button data-panel="maps" title="Maps" aria-label="Maps"><i data-lucide="map"></i></button><button data-panel="garage" title="Garage" aria-label="Garage"><i data-lucide="wrench"></i></button><button data-panel="editor" title="Map creator" aria-label="Map creator"><i data-lucide="pencil-ruler"></i></button><button id="reset" title="Recover vehicle" aria-label="Recover vehicle"><i data-lucide="rotate-ccw"></i></button><button id="pause" title="Pause" aria-label="Pause"><i data-lucide="pause"></i></button></nav></header>
<div class="run-info"><span id="vehicleLabel">Highwater 1000</span><span id="wheelieStat">BEST WHEELIE 0.0s</span></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="balance" id="balance"><span>NOSE UP</span><div><i id="balanceNeedle"></i></div><span>NOSE DOWN</span></div>
<div class="drive-controls" id="driveControls"><div class="left-controls"><button class="drive lean" data-control="up" aria-label="Lean back"><i data-lucide="move-up-left"></i><span>LEAN BACK</span></button><button class="drive lean" data-control="down" aria-label="Lean forward"><i data-lucide="move-down-right"></i><span>LEAN FORWARD</span></button><button class="drive wheelie" data-control="wheelie"><i data-lucide="bike"></i><span>WHEELIE</span></button></div><div class="pedals"><button class="drive brake" data-control="brake"><i data-lucide="octagon"></i><span>BRAKE / REV</span></button><button class="drive gas" data-control="gas"><i data-lucide="chevrons-up"></i><span>GAS</span></button></div></div>
<div class="editor-bar" id="editorBar" hidden><select id="brush" aria-label="Brush"><option value="height">Terrain</option><option value="mud">Mud</option><option value="water">Pond</option><option value="sand">Sand</option><option value="trail">Dry trail</option></select><label>Size<input id="brushSize" type="range" min="1" max="8" value="3"></label><button id="undo" title="Undo stroke" aria-label="Undo stroke"><i data-lucide="undo-2"></i></button><label class="map-pan">Map position<input id="mapPan" type="range" min="0" max="6000" value="0"></label><button id="saveMap"><i data-lucide="save"></i>Save</button><button id="testMap"><i data-lucide="play"></i>Ride</button></div>
<dialog id="panel"><header><div><small id="panelEyebrow">BUILD YOUR RIDE</small><h1 id="panelTitle">Garage</h1></div><button id="closePanel" title="Close" aria-label="Close"><i data-lucide="x"></i></button></header><div id="panelContent"></div></dialog>
<script src="vendor/matter.min.js"></script><script src="vendor/lucide.min.js"></script><script src="models.js"></script><script src="audio.js"></script><script src="endless.js"></script><script src="multiplayer.js"></script><script src="game.js?v=multiplayer-1"></script>
</body></html>
